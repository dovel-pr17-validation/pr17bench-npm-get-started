name: Release

# Pushing a version tag (v1.2.3) publishes a GitHub release: the tag must match package.json, and
# the notes are that version's section of CHANGELOG.md. The live site is deployed from main by
# the Deploy workflow, so a release records a version; it does not ship one.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr "../knowledge-library-$GITHUB_REF_NAME.zip" .)
          gh release create "$GITHUB_REF_NAME" "knowledge-library-$GITHUB_REF_NAME.zip" --title "The Personal Knowledge Library ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
